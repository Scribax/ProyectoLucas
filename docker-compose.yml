version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: granja-db
    environment:
      POSTGRES_USER: granja
      POSTGRES_PASSWORD: granja123
      POSTGRES_DB: granja_avicola
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - granja-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U granja -d granja_avicola"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: granja-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://granja:granja123@postgres:5432/granja_avicola
      JWT_SECRET: tu-secreto-jwt-super-seguro-cambia-esto
      JWT_EXPIRES_IN: 7d
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./backups:/app/backups
      - ./backups/invoices:/app/invoices
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - granja-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: granja-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - granja-network
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: granja-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./invoices:/var/www/invoices:ro
    depends_on:
      - frontend
      - backend
    networks:
      - granja-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  granja-network:
    driver: bridge
